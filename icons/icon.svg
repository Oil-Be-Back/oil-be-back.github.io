<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" fill="#0e1116"/>
  <g transform="translate(256 258) scale(1.14) translate(-256 -258)">
    <g fill="#ff8a3d" stroke="#ff8a3d" stroke-linejoin="round">
      <!-- air intake -->
      <rect x="206" y="128" width="100" height="26" rx="9" stroke="none"/>
      <rect x="240" y="150" width="32" height="50" stroke="none"/>
      <!-- engine block -->
      <path d="M150 196 H330 L374 240 V380 H150 Z" stroke-width="16"/>
      <!-- fan / pulley on the left -->
      <rect x="86" y="258" width="34" height="96" rx="9" stroke="none"/>
      <rect x="114" y="292" width="44" height="28" stroke="none"/>
      <!-- exhaust on the right -->
      <rect x="368" y="268" width="56" height="72" rx="10" stroke="none"/>
    </g>
    <!-- gaps that separate the parts, like the dashboard warning light -->
    <g fill="none" stroke="#0e1116" stroke-width="12" stroke-linecap="round">
      <path d="M196 244 H328"/>
      <path d="M196 244 V326"/>
    </g>
  </g>
</svg>
